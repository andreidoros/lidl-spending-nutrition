# Same palette as the Power BI report: cream surfaces, olive accent, warm
# browns for text, Segoe UI. Light mode sits on the report background photo,
# dark mode on deep olive. Switch with the sun/moon button in the app header
# or in the menu (Settings > Theme). app.py adds only what the theme cannot
# express: the page background, the white panel and the selected view tab.

[client]
# Hide Streamlit's developer chrome (Deploy, rerun, cache controls).
toolbarMode = "viewer"

[server]
# Serves static/app-background.jpg (the report photo) when it is present.
enableStaticServing = true

[theme]
font = "'Segoe UI', 'Segoe UI Variable', system-ui, sans-serif"
headingFont = "'Segoe UI', 'Segoe UI Variable', system-ui, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true

greenColor = "#5F6B3A"
orangeColor = "#C2703D"
redColor = "#B5452F"
yellowColor = "#D9A441"
blueColor = "#4F6D7A"

[theme.light]
primaryColor = "#5F6B3A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7EDE0"
textColor = "#29261D"
borderColor = "#D9CBB5"
linkColor = "#5F6B3A"
dataframeBorderColor = "#EFE6D9"
dataframeHeaderBackgroundColor = "#F7EDE0"
dataframeHeaderTextColor = "#7C7566"

[theme.dark]
primaryColor = "#9DAE6A"
backgroundColor = "#1F2118"
secondaryBackgroundColor = "#2B2E21"
textColor = "#FBF5EC"
borderColor = "#454836"
linkColor = "#C9D59B"
dataframeBorderColor = "#3A3D2D"
dataframeHeaderBackgroundColor = "#2B2E21"
dataframeHeaderTextColor = "#CFC6B4"
